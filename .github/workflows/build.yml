# Автоматическая сборка на серверах GitHub (бесплатно для публичных репозиториев).
# Результат: UniMusic.dmg (Mac) и UniMusic.ipa (iPhone, для установки через Sideloadly/AltStore).
# Создайте тег v1.0 (или нажмите "Run workflow"), и файлы появятся во вкладке Releases / Actions.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build macOS app
        run: |
          xcodebuild -project UniMusic.xcodeproj -target UniMusic-macOS -configuration Release \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" \
            SYMROOT="$PWD/build" | tail -n 40
          test -d build/Release/UniMusic.app

      - name: Make DMG
        run: |
          mkdir -p dmg && cp -R build/Release/UniMusic.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname UniMusic -srcfolder dmg -ov -format UDZO UniMusic.dmg
          du -h UniMusic.dmg

      - name: Build iOS app (unsigned)
        run: |
          xcodebuild -project UniMusic.xcodeproj -target UniMusic-iOS -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            SYMROOT="$PWD/build" | tail -n 40
          mkdir -p Payload && cp -R build/Release-iphoneos/UniMusic.app Payload/
          zip -qry UniMusic.ipa Payload
          du -h UniMusic.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: UniMusic
          path: |
            UniMusic.dmg
            UniMusic.ipa

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            UniMusic.dmg
            UniMusic.ipa
